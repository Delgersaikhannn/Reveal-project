<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Ethereum – Gated Content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .page-header {
      background: #f5f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .page-header .logo img {
      height: 64px;
      width: auto;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 560px;
      width: 100%;
      padding: 40px 48px;
      position: relative;
    }
    .sign-in-header {
      padding-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 24px;
    }
    .sign-in-header h1 {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #2C3E50;
      text-align: left;
      letter-spacing: -0.02em;
    }
    .illustration {
      width: 100%;
      margin-bottom: 32px;
    }
    .illustration img {
      width: 100%;
      height: auto;
      display: block;
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.2s, background 0.2s;
    }
    .step.active {
      border-color: #6366f1;
      background: #fafaff;
    }
    .step.inactive {
      opacity: 0.7;
    }
    .step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }
    .step.active .step-num {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }
    .step.inactive .step-num {
      background: #e5e7eb;
      color: #6b7280;
    }
    .step-content h3 {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }
    .step-content p {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
    }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .btn-connect {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-connect:hover {
      background: #2563eb;
    }
    .btn-connect:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: #6b7280;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover {
      background: #f3f4f6;
      color: #111827;
    }
    .modal-body {
      padding: 16px;
    }
    .wallet-option {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .wallet-option:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }
    .wallet-option:first-child {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .wallet-option:first-child:hover {
      background: #dbeafe;
      border-color: #2563eb;
    }
    .wallet-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .wallet-option.reveal .wallet-icon {
      background: #e5e7eb;
      color: #6b7280;
      /* Empty placeholder icon */
    }
    .wallet-option.metamask .wallet-icon {
      background: #fff7ed;
    }
    .wallet-option.coinbase .wallet-icon {
      background: #eff6ff;
    }
    .wallet-option.other .wallet-icon {
      background: #f3f4f6;
    }
    .wallet-name {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }
    .wallet-option .chevron {
      margin-left: auto;
      color: #9ca3af;
      font-size: 14px;
    }
    .no-wallet {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: #6b7280;
      font-size: 14px;
      margin-top: 8px;
      cursor: pointer;
    }
    .no-wallet:hover {
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="logo">
      <img src="images/devfolio.png" alt="Devfolio" />
    </div>
  </div>

  <div class="card">
    <div class="sign-in-header">
      <h1>Sign in with Ethereum</h1>
    </div>
    <div class="illustration">
      <img src="images/middle-img.png" alt="" aria-hidden="true" />
    </div>

    <div class="steps">
      <div class="step active" id="step1">
        <span class="step-num">1</span>
        <div class="step-content">
          <h3>Connect wallet</h3>
          <p>Go to your wallet app and accept the connection request</p>
        </div>
      </div>
      <div class="step inactive" id="step2">
        <span class="step-num">2</span>
        <div class="step-content">
          <h3>Verify address</h3>
          <p>Verify your address by signing a message</p>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn-connect" id="btnConnect" type="button">Connect wallet</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Connect Wallet</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="wallet-option reveal" data-wallet="reveal" title="Reveal – Prove claims without sharing your address">
          <div class="wallet-icon" aria-hidden="true"></div>
          <span class="wallet-name">Reveal</span>
          <span class="chevron">&#8250;</span>
        </div>
        <div class="wallet-option metamask" data-wallet="metamask">
          <div class="wallet-icon">🦊</div>
          <span class="wallet-name">MetaMask</span>
          <span class="chevron">&#8250;</span>
        </div>
        <div class="wallet-option coinbase" data-wallet="coinbase">
          <div class="wallet-icon">&#9711;</div>
          <span class="wallet-name">Coinbase Wallet</span>
          <span class="chevron">&#8250;</span>
        </div>
        <div class="wallet-option other" data-wallet="other">
          <div class="wallet-icon">&#9881;</div>
          <span class="wallet-name">Other Wallets</span>
          <span class="chevron">&#8250;</span>
        </div>
        <a href="#" class="no-wallet" id="noWallet">I don't have a wallet</a>
      </div>
    </div>
  </div>

  <script>
    const btnConnect = document.getElementById('btnConnect');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const noWallet = document.getElementById('noWallet');

    btnConnect.addEventListener('click', () => {
      modalOverlay.classList.add('open');
    });

    modalClose.addEventListener('click', () => {
      modalOverlay.classList.remove('open');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('open');
      }
    });

    document.querySelectorAll('.wallet-option').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const wallet = el.dataset.wallet;
        if (wallet === 'reveal') {
          // TODO: connect to Reveal extension
          alert('Reveal selected – will connect to extension next.');
        } else if (wallet === 'metamask') {
          alert('MetaMask – not wired yet.');
        } else if (wallet === 'coinbase') {
          alert('Coinbase Wallet – not wired yet.');
        } else if (wallet === 'other') {
          alert('Other Wallets – not wired yet.');
        }
      });
    });

    noWallet.addEventListener('click', (e) => {
      e.preventDefault();
      alert('You need a wallet to access this content. Try MetaMask or another Ethereum wallet.');
    });
  </script>
</body>
</html>
