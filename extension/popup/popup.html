<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selective Disclosure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1f2937;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #111827; }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #374151; }
    .screen { display: none; }
    .screen.active { display: block; }
    .proof-list { list-style: none; }
    .proof-item {
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .proof-item:hover { background: #f3f4f6; }
    .proof-item.expanded { background: #f3f4f6; border-color: #d1d5db; }
    .proof-type { font-size: 14px; font-weight: 500; color: #111827; }
    .proof-ttl { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .proof-detail {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb;
      font-size: 12px; color: #4b5563;
    }
    .proof-detail-row { margin-bottom: 4px; }
    .proof-detail-label { color: #6b7280; }
    .add-new {
      margin-top: 12px; padding: 12px; text-align: center;
      background: #eff6ff; border: 1px dashed #3b82f6; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 500; color: #2563eb;
      transition: background 0.15s;
    }
    .add-new:hover { background: #dbeafe; }
    .wallet-list { list-style: none; margin-bottom: 12px; }
    .wallet-item {
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: ui-monospace, monospace;
    }
    .wallet-item:hover { background: #f3f4f6; }
    .btn {
      width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 6px;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { font-size: 12px; color: #dc2626; margin-top: 8px; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 8px; }
    .claim-option {
      padding: 12px; background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 8px; margin-bottom: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500;
    }
    .claim-option:hover { background: #f3f4f6; }
  </style>
</head>
<body>
  <div id="screenMain" class="screen active">
    <h1>What do you want to prove?</h1>
    <ul class="proof-list" id="proofList"></ul>
    <div class="add-new" id="addNewProof">+ Add new proof</div>
  </div>

  <div id="screenAddStep1" class="screen">
    <h1>Connect to your wallet or select one</h1>
    <ul class="wallet-list" id="savedWalletList"></ul>
    <button class="btn btn-primary" id="connectNewWallet">Connect new wallet</button>
    <p class="error" id="step1Error" style="display: none;"></p>
    <p class="hint" id="step1Hint">Approve the connection in MetaMask (in the tab) when prompted.</p>
    <button class="btn btn-secondary" id="backFromStep1" style="margin-top: 12px;">Back</button>
  </div>

  <div id="screenAddStep2" class="screen">
    <h1>What to prove?</h1>
    <p class="hint" id="selectedAddressLabel" style="margin-bottom: 12px;"></p>
    <p class="hint" style="margin-bottom: 6px;">I hold…</p>
    <div style="margin-bottom: 8px;">
      <select id="assetSelect" class="asset-select" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; background: #fff;">
        <option value="weth-sepolia">WETH (Sepolia)</option>
        <option value="eth-native">Sepolia ETH (native)</option>
        <option value="custom">Custom ERC20</option>
      </select>
    </div>
    <div id="customTokenWrap" style="display: none; margin-bottom: 8px;">
      <input type="text" id="customTokenInput" placeholder="0x… token address" class="token-input" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: ui-monospace, monospace;" />
    </div>
    <button class="btn btn-primary" id="verifyClaimBtn" style="margin-top: 4px;">Verify</button>
    <p class="error" id="step2Error" style="display: none; margin-top: 8px;"></p>
    <p class="hint" id="step2Hint" style="margin-top: 8px;">Proves you hold at least 1 wei.</p>
    <button class="btn btn-secondary" id="backFromStep2" style="margin-top: 12px;">Back</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
